name: Sync test

# The sync server (functions/api) with a local database, and the app talking to it from several
# browsers: linking devices, edits both ways, offline edits, pictures, invitations, removals.
# Runs on changes to the server or the sync code, and by hand.
on:
  workflow_dispatch:
  push:
    paths: ['functions/**', 'src/sync/**', 'e2e/sync_*', '.github/workflows/sync-test.yml']
  pull_request:
    paths: ['functions/**', 'src/sync/**', 'e2e/sync_*', '.github/workflows/sync-test.yml']

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install the test tools
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium || python -m playwright install chromium

      - name: Start the server with a local database
        run: |
          npx --yes wrangler@4 pages dev dist --port 8788 --ip 127.0.0.1 > server.log 2>&1 &
          for i in $(seq 1 90); do curl -s -o /dev/null http://127.0.0.1:8788/api/health && break; sleep 1; done
          curl -s http://127.0.0.1:8788/api/health

      - name: The API
        run: python e2e/sync_api_test.py | tee api.txt; ! grep -q '^FAIL' api.txt

      - name: Devices in browsers
        run: python e2e/sync_devices_test.py | tee devices.txt; ! grep -q '^FAIL' devices.txt

      - name: A device moved to the right account
        run: python e2e/sync_relink_test.py | tee relink.txt; ! grep -q '^FAIL' relink.txt

      - name: Keep the server log and pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-test
          path: |
            server.log
            sync-shots/
