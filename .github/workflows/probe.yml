name: Supabase setup check

# Manual: reports which parts of the Supabase setup are in place, without creating anything.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Network check
        run: |
          H=ktdmwlwvdhbcvffplkkl.supabase.co
          echo "== dig $H"; dig $H | grep -E "status:|IN" || true
          echo "== getent"; getent hosts $H || echo "no address"
          echo "== other projects resolve?"; getent hosts supabase.co api.supabase.com || true
          echo "== https"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" "https://$H/auth/v1/health" -H "apikey: sb_publishable_rP3VDhQE-ZolnbBBpn2LGQ_FLFFAWBW" || true
