name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'supabase/**', 'docs/**', 'e2e/**', '.github/workflows/sync-test.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build web app
        run: npx vite build

      - name: Copy into the Android project
        run: npx cap sync android

      # The release key lives in android/signing (it is itself encrypted with its password);
      # the password comes from the repository secret ANDROID_KEYSTORE_PASSWORD.
      - name: Build APK
        working-directory: android
        env:
          QIRTAS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$QIRTAS_KEYSTORE_PASSWORD" ]; then
            export QIRTAS_KEYSTORE="$PWD/signing/qirtas-release.p12"
            export QIRTAS_KEY_ALIAS=qirtas
            export QIRTAS_KEY_PASSWORD="$QIRTAS_KEYSTORE_PASSWORD"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning title=Test build only::The secret ANDROID_KEYSTORE_PASSWORD is missing, so this APK is signed with a throwaway debug key and no release is published."
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../out
          cp app/build/outputs/apk/release/*.apk "../out/qirtas-1.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Publish release
        if: env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: قِرطاس 1.0.${{ github.run_number }}
          files: out/*.apk
          make_latest: true
